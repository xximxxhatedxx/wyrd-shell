# =============================================================================
# Wyrd Shell - Hyprland Integration Snippet
# Add these lines to your ~/.config/hypr/hyprland.conf
# =============================================================================

# 1. Autostart
exec-once = wyrd-shell

# 2. Window & Layer Rules (Glass / Blur effects for floating bar and popups)
layerrule = blur, wyrd-shell
layerrule = ignorezero, wyrd-shell
layerrule = xray 1, wyrd-shell

# 3. Keybindings (Optional shortcuts for popups)
# Example: SUPER + Space opens Application Launcher
bind = $mainMod, Space, exec, wyrd-shell --action popup:launcher

# Example: SUPER + N opens Notification Center
bind = $mainMod, N, exec, wyrd-shell --action popup:notifications

# Example: SUPER + Escape opens Power Menu
bind = $mainMod, Escape, exec, wyrd-shell --action popup:power
